name: ci

on:
  push:
  pull_request:
  # 手动触发（可在 Actions 页面指定分支跑一次全量流水线）
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # v2 重构后（方案 §4：全 Node ESM / node:test）：构建 = src/→dist/ 纯拷贝字节比对，
  # 回归 = node --test 全仓。零 Python 运行时（旧 autopilot/py_compile 步骤已随 0.6.x 退役）。
  # 真实安装冒烟（migrate.test.mjs 尾部）默认关闭，仅本地设 ZTK_SMOKE_REAL=1 才启用。
  # ---------------------------------------------------------------------------
  test:
    name: node:test (${{ matrix.os }} / node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # README/方案前置：node ≥ 22.5（node:sqlite）——22 下限 + 最新版双档
        os: [ubuntu-latest, windows-latest]
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 构建（src/ → dist/ 发布拷贝 + 逐文件字节比对）
        run: node scripts/build.mjs

      - name: 回归测试（node --test 全仓）
        shell: bash
        run: |
          set -euo pipefail
          # `node --test test/`（目录位置参数）在部分 node/win32 组合被当作模块入口报 MODULE_NOT_FOUND，
          # 故用 glob 形式（node ≥22 原生支持 --test glob）；与本地 `node --test` 等价。
          node --test "test/*.test.mjs" 2>&1 | tee test-output.txt

      # 无论成功失败都留测试输出，便于定位偶发问题
      - name: 上传测试输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-node${{ matrix.node-version }}
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 14
